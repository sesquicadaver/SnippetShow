name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main, "cursor/**"]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install GTK / WebKit (Wails Linux deps)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (embed assets)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          # keep embed dir non-empty for local/dev checkouts that skip npm
          touch dist/.gitkeep

      - name: Vet
        run: go vet -tags webkit2_41 ./...

      - name: Test
        run: go test -tags webkit2_41 ./...

      - name: Install staticcheck (FIX-L4 / SS-28)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: staticcheck
        run: staticcheck -tags webkit2_41 ./...

      - name: Local CI script
        run: ./scripts/ci-local.sh
        env:
          STATICCHECK_VERSION: "2026.2.2"
